id: https://w3id.org/NFDI4Chem/ms-dcat-ap/dataset
name: ms-dataset
title: ms-dataset
description: |
  Dataset definitions for mass spectrometry (MS) DCAT-AP.
license: MIT
default_prefix: ms_dcat_ap
default_range: string

prefixes:
  ms_dcat_ap: https://w3id.org/NFDI4Chem/ms-dcat-ap/
  dcat: http://www.w3.org/ns/dcat#

imports:
  - chem_dcat_ap
  - ms_sample
  - ms_measurement

classes:
  MSSampleMeasurementDataset:
    is_a: Dataset
    class_uri: dcat:Dataset
    description: >
      A dataset that is the result of a measurement of a MSSample using a MassSpectrometer.
    slot_usage:
      was_generated_by:
        range: MassSpectrometry
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      is_about_entity:
        range: MSSample
        recommended: true
        multivalued: true
        inlined: false
        inlined_as_list: false
